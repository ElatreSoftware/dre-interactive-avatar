<!doctype html>
<html lang="en">

      body { font: 16px/1.5 system-ui; margin: 0; padding: 40px; }
      main { max-width: 40ch; }

  <body>

      <p>A customer's page. The widget is mounted by the one script tag below.</p>

      document.getElementById("open-from-host").addEventListener("click", function () {
        window.DreWidget.open();
      });
