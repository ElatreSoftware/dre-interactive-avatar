# Optional local Postgres, for working offline or without touching the shared
# development server. The project points at a managed database by default; this
# is here so that is a choice rather than a requirement.
#
#   pnpm db:up
#   DATABASE_URL="postgresql://avatar:avatar@localhost:5441/dre_video_avatar" pnpm db:migrate
services:
  postgres:
    image: postgres:16-alpine
    container_name: dre-avatar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: avatar
      POSTGRES_PASSWORD: avatar
      POSTGRES_DB: dre_video_avatar
    ports:
      - "5441:5432"
    volumes:
      - dre-avatar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avatar -d dre_video_avatar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dre-avatar-pgdata:
