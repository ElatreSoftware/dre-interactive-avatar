<!--
  Placeholder favicon: a monogram on the brand navy, the same #09053a as the
  brand-950 token in globals.css. Next serves this from /icon.svg and links it
  automatically; replace the file to change the icon, no markup needed.

  SVG rather than .ico so it stays sharp at every size and weighs nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dr. E">
  <rect width="64" height="64" rx="16" fill="#09053a" />
  <!-- A camera lens, echoing the launcher button: this is a video widget. -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  <text
    x="32"
    y="33"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="central"
  >E</text>
</svg>
